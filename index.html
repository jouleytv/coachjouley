<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Jouley Predictions — Premier League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#f6f4fb;
    --bg2:#ece7f7;
    --card:#ffffff;
    --ink:#1c1530;
    --muted:#8a82a0;
    --line:#ece8f5;
    --grad:linear-gradient(135deg,#7c3aed 0%,#c026d3 50%,#ec4899 100%);
    --grad-soft:linear-gradient(135deg,rgba(124,58,237,.12),rgba(236,72,153,.12));
    --purple:#7c3aed;
    --pink:#ec4899;
    --win:#16a34a;
    --shadow:0 10px 30px -12px rgba(80,30,140,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Archivo',sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%,rgba(192,38,211,.10),transparent 60%),
      radial-gradient(900px 500px at 50% 110%,rgba(124,58,237,.10),transparent 60%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:18px 0 60px;
  }
  .stage{
    width:100%;
    max-width:430px;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .crest{
    width:74px;height:74px;border-radius:22px;
    background:var(--grad);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .crest svg{width:40px;height:40px;}
  .brand{
    font-family:'Archivo Black',sans-serif;
    font-size:30px;letter-spacing:-1px;line-height:.95;
    text-align:center;text-transform:uppercase;
  }
  .brand .sub{
    display:block;
    background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{
    margin-top:10px;
    font-size:12px;font-weight:700;letter-spacing:3px;
    text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:8px;
  }
  .tagline .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);}
  .matchweek{
    margin-top:16px;margin-bottom:6px;
    padding:7px 16px;border-radius:999px;
    background:var(--grad-soft);
    border:1px solid rgba(124,58,237,.18);
    font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
    color:var(--purple);
  }
  .scoreboard{
    width:100%;
    margin:14px 0 18px;
    background:var(--card);
    border-radius:18px;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    padding:8px 4px;
  }
  .scoreboard-head{
    text-align:center;font-size:10px;font-weight:800;letter-spacing:2px;
    color:var(--muted);text-transform:uppercase;padding:8px 0 6px;
  }
  .results{display:none;}
  .results.show{display:block;}
  .res-row{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    gap:8px;padding:6px 14px;font-size:13px;
  }
  .res-row + .res-row{border-top:1px solid var(--line);}
  .res-row .h{text-align:right;font-weight:700;}
  .res-row .a{text-align:left;font-weight:700;}
  .res-row .sc{
    font-family:'Archivo Black',sans-serif;font-size:14px;
    padding:3px 10px;border-radius:8px;background:var(--grad-soft);color:var(--purple);
    white-space:nowrap;
  }
  .reveal-btn{
    display:block;width:calc(100% - 24px);margin:6px 12px 8px;
    padding:11px;border:none;border-radius:12px;cursor:pointer;
    font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;
    letter-spacing:1px;text-transform:uppercase;color:#fff;
    background:var(--grad);box-shadow:var(--shadow);
    transition:transform .12s ease,filter .12s ease;
  }
  .reveal-btn:active{transform:scale(.97);}
  .reveal-btn.revealed{filter:grayscale(.2) brightness(.95);}
  .progress-wrap{width:100%;margin-bottom:10px;}
  .progress-track{height:8px;border-radius:999px;background:#e7e1f3;overflow:hidden;}
  .progress-fill{height:100%;width:0;background:var(--grad);transition:width .3s ease;border-radius:999px;}
  .progress-label{
    text-align:center;font-size:11px;font-weight:800;letter-spacing:1px;
    color:var(--muted);text-transform:uppercase;margin-top:7px;
  }
  .matches{width:100%;display:flex;flex-direction:column;gap:14px;}
  .card{
    background:var(--card);border-radius:18px;border:1px solid var(--line);
    box-shadow:var(--shadow);padding:14px 14px 16px;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad);
    opacity:0;transition:opacity .2s ease;
  }
  .card.done::before{opacity:1;}
  .card-num{
    position:absolute;top:10px;right:14px;
    font-family:'Archivo Black',sans-serif;font-size:11px;color:var(--muted);
    letter-spacing:1px;
  }
  .card-date{
    font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted);
    text-transform:uppercase;margin-bottom:10px;
  }
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
  .team{
    border:2px solid var(--line);border-radius:14px;
    padding:12px 6px 10px;cursor:pointer;text-align:center;
    transition:all .15s ease;background:#fbfaff;
    display:flex;flex-direction:column;align-items:center;gap:7px;
  }
  .team .badge{
    width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  }
  .team .badge img{max-width:100%;max-height:100%;object-fit:contain;}
  .team .name{font-size:12px;font-weight:800;line-height:1.1;}
  .team:active{transform:scale(.97);}
  .team.picked{
    border-color:var(--purple);
    background:var(--grad-soft);
    box-shadow:0 0 0 3px rgba(124,58,237,.12);
  }
  .team.picked .name{color:var(--purple);}
  .vs{
    font-family:'Archivo Black',sans-serif;font-size:13px;color:var(--muted);
    padding:0 2px;
  }
  .draw-row{margin-top:9px;}
  .draw{
    width:100%;padding:9px;border:2px solid var(--line);border-radius:12px;
    background:#fbfaff;cursor:pointer;font-family:'Archivo',sans-serif;
    font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:var(--muted);transition:all .15s ease;
  }
  .draw:active{transform:scale(.98);}
  .draw.picked{
    border-color:var(--pink);color:var(--pink);background:rgba(236,72,153,.08);
    box-shadow:0 0 0 3px rgba(236,72,153,.1);
  }
  .ou{
    margin-top:13px;padding-top:13px;border-top:1px dashed var(--line);
  }
  .ou-title{
    font-size:10px;font-weight:800;letter-spacing:2px;color:var(--muted);
    text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:6px;
  }
  .ou-title::before{content:"";width:14px;height:2px;background:var(--grad);border-radius:2px;}
  .ou-controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;}
  .ou-btn{
    padding:11px 4px;border:2px solid var(--line);border-radius:12px;
    background:#fbfaff;cursor:pointer;font-family:'Archivo',sans-serif;
    font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--ink);transition:all .15s ease;
  }
  .ou-btn:active{transform:scale(.97);}
  .ou-btn.over.picked{border-color:var(--win);color:var(--win);background:rgba(22,163,74,.08);box-shadow:0 0 0 3px rgba(22,163,74,.1);}
  .ou-btn.under.picked{border-color:var(--pink);color:var(--pink);background:rgba(236,72,153,.08);box-shadow:0 0 0 3px rgba(236,72,153,.1);}
  .line-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:2px solid var(--line);border-radius:12px;background:#fff;min-width:74px;padding:4px;
  }
  .line-box label{
    font-size:8px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;
  }
  .line-box input{
    width:100%;border:none;outline:none;text-align:center;background:transparent;
    font-family:'Archivo Black',sans-serif;font-size:20px;color:var(--purple);
    -moz-appearance:textfield;
  }
  .line-box input::-webkit-outer-spin-button,
  .line-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .footer{
    margin-top:24px;text-align:center;font-size:11px;font-weight:700;
    letter-spacing:2px;color:var(--muted);text-transform:uppercase;
  }
  .footer span{
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .reset{
    margin-top:14px;padding:9px 20px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:var(--muted);font-family:'Archivo',sans-serif;font-weight:800;
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
  }
  .reset:active{transform:scale(.97);}
</style>
</head>

  const MATCHES = [
    {h:"Brighton",      a:"Man Utd",     hs:0, as:3, hi:"BHA", ai:"MUN"},
    {h:"Burnley",       a:"Wolves",      hs:1, as:1, hi:"BUR", ai:"WOL"},
    {h:"Crystal Palace",a:"Arsenal",     hs:1, as:2, hi:"CRY", ai:"ARS"},
    {h:"Fulham",        a:"Newcastle",   hs:2, as:0, hi:"FUL", ai:"NEW"},
    {h:"Liverpool",     a:"Brentford",   hs:1, as:1, hi:"LIV", ai:"BRE"},
    {h:"Man City",      a:"Aston Villa", hs:1, as:2, hi:"MCI", ai:"AVL"},
    {h:"Forest",        a:"Bournemouth", hs:1, as:1, hi:"NFO", ai:"BOU"},
    {h:"Sunderland",    a:"Chelsea",     hs:2, as:1, hi:"SUN", ai:"CHE"},
    {h:"Tottenham",     a:"Everton",     hs:1, as:0, hi:"TOT", ai:"EVE"},
    {h:"West Ham",      a:"Leeds",       hs:3, as:0, hi:"WHU", ai:"LEE"},
  ];

  const picks = {};
  const matchesEl = document.getElementById('matches');
  const resultsEl = document.getElementById('results');

  MATCHES.forEach((m,i)=>{
    picks[i] = {winner:null, ou:null};
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card'+i;
    card.innerHTML = `
      <div class="card-num">#${i+1}</div>
      <div class="card-date">24/05/26 · Full Time</div>
      <div class="teams">
        <div class="team" data-i="${i}" data-pick="home">
          <div class="badge"><img src="${LOGOS[m.hi]}" alt="${m.h}"></div>
          <div class="name">${m.h}</div>
        </div>
        <div class="vs">VS</div>
        <div class="team" data-i="${i}" data-pick="away">
          <div class="badge"><img src="${LOGOS[m.ai]}" alt="${m.a}"></div>
          <div class="name">${m.a}</div>
        </div>
      </div>
      <div class="draw-row">
        <button class="draw" data-i="${i}" data-pick="draw">Unentschieden</button>
      </div>
      <div class="ou">
        <div class="ou-title">Over / Under · Tore</div>
        <div class="ou-controls">
          <button class="ou-btn over" data-i="${i}" data-ou="over">Over</button>
          <div class="line-box">
            <label>Line</label>
            <input type="number" step="0.5" min="0" data-i="${i}" data-line>
          </div>
          <button class="ou-btn under" data-i="${i}" data-ou="under">Under</button>
        </div>
      </div>
    `;
    matchesEl.appendChild(card);

    const row = document.createElement('div');
    row.className = 'res-row';
    row.innerHTML = `<div class="h">${m.h}</div><div class="sc">${m.hs} – ${m.as}</div><div class="a">${m.a}</div>`;
    resultsEl.appendChild(row);
  });

  matchesEl.addEventListener('click', e=>{
    const team = e.target.closest('.team');
    const draw = e.target.closest('.draw');
    const ou   = e.target.closest('.ou-btn');
    if(team){
      const i = +team.dataset.i, pick = team.dataset.pick;
      picks[i].winner = pick;
      const card = document.getElementById('card'+i);
      card.querySelectorAll('.team').forEach(t=>t.classList.remove('picked'));
      card.querySelector('.draw').classList.remove('picked');
      team.classList.add('picked');
      mark(i);
    }
    if(draw){
      const i = +draw.dataset.i;
      picks[i].winner = 'draw';
      const card = document.getElementById('card'+i);
      card.querySelectorAll('.team').forEach(t=>t.classList.remove('picked'));
      draw.classList.toggle('picked', true);
      mark(i);
    }
    if(ou){
      const i = +ou.dataset.i, val = ou.dataset.ou;
      picks[i].ou = val;
      const card = document.getElementById('card'+i);
      card.querySelectorAll('.ou-btn').forEach(b=>b.classList.remove('picked'));
      ou.classList.add('picked');
      mark(i);
    }
  });

  function mark(i){
    const card = document.getElementById('card'+i);
    if(picks[i].winner) card.classList.add('done');
    updateProgress();
  }
  function updateProgress(){
    const done = Object.values(picks).filter(p=>p.winner).length;
    const pct = (done/MATCHES.length)*100;
    document.getElementById('progFill').style.width = pct+'%';
    document.getElementById('progLabel').textContent = `${done} / ${MATCHES.length} Predicted`;
  }

  const revealBtn = document.getElementById('revealBtn');
  revealBtn.addEventListener('click', ()=>{
    const shown = resultsEl.classList.toggle('show');
    revealBtn.classList.toggle('revealed', shown);
    revealBtn.textContent = shown ? 'Ergebnisse verstecken' : 'Ergebnisse aufdecken';
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    document.querySelectorAll('.team,.draw,.ou-btn').forEach(el=>el.classList.remove('picked'));
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('done'));
    document.querySelectorAll('input[data-line]').forEach(inp=>inp.value='');
    Object.keys(picks).forEach(k=>{picks[k]={winner:null,ou:null};});
    resultsEl.classList.remove('show');
    revealBtn.classList.remove('revealed');
    revealBtn.textContent='Ergebnisse aufdecken';
    updateProgress();
  });
</script>
</body>
</html>
